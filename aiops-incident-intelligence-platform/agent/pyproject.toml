[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops-node-agent"
version = "1.0.0"
description = "Lightweight node agent that forwards system metrics and log lines to the AIOps Incident Intelligence Platform."
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aiops-node-agent = "aiops_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiops_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
