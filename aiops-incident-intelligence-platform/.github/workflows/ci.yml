name: CI

on:
  push:
    paths:
      - "aiops-incident-intelligence-platform/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "aiops-incident-intelligence-platform/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: aiops-incident-intelligence-platform

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: aiops-incident-intelligence-platform/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aiops-incident-intelligence-platform:ci .
        working-directory: aiops-incident-intelligence-platform
