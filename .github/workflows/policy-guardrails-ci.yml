name: Policy Guardrails CI

on:
  push:
    branches: [main]
    paths:
      - 'terraform-policy-guardrails/**'
      - '.github/workflows/policy-guardrails-ci.yml'
  pull_request:
    paths:
      - 'terraform-policy-guardrails/**'
      - '.github/workflows/policy-guardrails-ci.yml'

defaults:
  run:
    working-directory: terraform-policy-guardrails

jobs:
  opa-test:
    name: OPA Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - run: opa fmt --fail -l policy/
      - run: opa test policy/ -v

  regal-lint:
    name: Rego Lint (Regal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Regal
        run: |
          curl -sL -o regal "https://github.com/open-policy-agent/regal/releases/download/v0.42.0/regal_Linux_x86_64"
          chmod +x regal
          sudo mv regal /usr/local/bin/regal
      - run: regal lint policy/

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/*.sh

  actionlint:
    name: Actionlint (workflow YAML)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          curl -sL -o al.tar.gz "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          tar -xzf al.tar.gz actionlint
          chmod +x actionlint
          sudo mv actionlint /usr/local/bin/actionlint
      - run: actionlint .github/workflows/policy-guardrails-ci.yml

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yamllint
      - run: |
          yamllint -c terraform-policy-guardrails/.yamllint.yml \
            .github/workflows/policy-guardrails-ci.yml \
            terraform-policy-guardrails/.regal/config.yaml

  markdown-lint:
    name: Markdown Lint (README)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymarkdownlnt
      - run: pymarkdown --config .pymarkdown.json scan README.md

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Install Gitleaks
        run: |
          curl -sL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan the current tree for secrets
        run: gitleaks dir terraform-policy-guardrails -v

  terraform-fmt-validate:
    name: Terraform Format & Validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [examples/compliant, examples/noncompliant]
    defaults:
      run:
        working-directory: terraform-policy-guardrails/${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -diff .
      - run: terraform init -input=false
      - run: terraform validate

  checkov:
    name: Checkov Security Scan (examples/compliant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform-policy-guardrails/examples/compliant
          framework: terraform
          soft_fail: true

  check-examples:
    name: Gate Check (${{ matrix.dir }})
    runs-on: ubuntu-latest
    needs: opa-test
    strategy:
      matrix:
        include:
          - dir: examples/compliant
            expect: pass
          - dir: examples/noncompliant
            expect: fail
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Run gate against ${{ matrix.dir }}, expecting it to ${{ matrix.expect }}
        run: |
          set +e
          bash scripts/check.sh "${{ matrix.dir }}"
          status=$?
          set -e
          if [ "${{ matrix.expect }}" = "pass" ] && [ "$status" -ne 0 ]; then
            echo "Expected ${{ matrix.dir }} to pass the gate, but it failed."
            exit 1
          fi
          if [ "${{ matrix.expect }}" = "fail" ] && [ "$status" -eq 0 ]; then
            echo "Expected ${{ matrix.dir }} to fail the gate, but it passed."
            exit 1
          fi
          echo "Gate behaved as expected for ${{ matrix.dir }}."

  signed-bundle-server:
    name: Signed Bundle + Policy Decision Server
    runs-on: ubuntu-latest
    needs: opa-test
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Build and sign the policy bundle
        run: bash scripts/build-signed-bundle.sh

      - name: Start the policy decision server
        run: |
          bash scripts/serve.sh >server.log 2>&1 &
          echo $! >server.pid
          for _ in $(seq 1 20); do
            curl -sf http://localhost:8181/health >/dev/null && exit 0
            sleep 0.5
          done
          echo "Server never became healthy"; cat server.log; exit 1

      - name: Query the live server — noncompliant example must be rejected
        run: |
          set +e
          bash scripts/query.sh examples/noncompliant
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the policy server to report violations for examples/noncompliant"
            exit 1
          fi

      - name: Query the live server — compliant example must pass
        run: bash scripts/query.sh examples/compliant

      - name: Stop the server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true

      - name: Tamper with the signed bundle's content and confirm OPA refuses to load it
        run: |
          mkdir -p extracted
          tar -xzf bundle.tar.gz -C extracted
          echo "# tampered after signing" >>extracted/policy/terraform.rego
          (cd extracted && tar -czf ../bundle.tampered.tar.gz .manifest .signatures.json data.json policy)

          set +e
          timeout 5 opa run --server --addr :8199 --bundle bundle.tampered.tar.gz \
            --verification-key .keys/public.pem --verification-key-id portfolio-demo
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "OPA should have refused to load a bundle whose content doesn't match its signature, but it started."
            exit 1
          fi
          echo "Confirmed: OPA rejected the tampered bundle instead of silently trusting it."
